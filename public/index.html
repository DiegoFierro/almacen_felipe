  <script>
    (function () {
      var t = 'dark';
      try {
        var s = localStorage.getItem('af-theme');
        if (s === 'light' || s === 'dark') t = s;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'light' ? '#f4f7f5' : '#0e1311');
    })();
  </script>

  <div class="brand">
    <img src="/favicon.svg" alt="" width="36" height="36" class="brand-logo">
    <div>
      <h1>Almacén Felipe</h1>
      <p>Consulta de precios</p>
    </div>
  </div>

  <div class="header-actions">
    <button type="button" id="installBtn" class="btn-ghost" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
      <span>Instalar</span>
    </button>

      <span class="label-to-light">Claro</span>
      <span class="label-to-dark">Oscuro</span>
    </button>
  </div>
</header>

  <div class="searchbar">
  <form id="searchForm" class="search" role="search" autocomplete="off" novalidate>
    <div class="field">
      <label for="searchInput" class="sr-only">Buscar producto o marca</label>
      <input
        id="searchInput"
        name="q"
        type="search"
        placeholder="Producto o marca…"
        inputmode="search"
        enterkeyhint="search"
        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="suggestions"

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <button type="submit" class="btn-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Buscar</span>
    </button>

    <ul id="suggestions" role="listbox" aria-label="Sugerencias" hidden></ul>
  </form>
</div>

  <main id="results" class="results" aria-live="polite">

      </button>
    </div>
  </div>

  <ul id="productList" class="list" aria-busy="true"></ul>
  <div id="emptyState" class="empty" hidden></div>
</main>


  </div>
