<header class="header">
  <div class="brand">
    <img src="{{ "favicon.svg" | relURL }}" alt="" width="36" height="36" class="brand-logo">
    <div>
      <h1>{{ site.Params.brand }}</h1>
      <p>{{ site.Params.tagline }}</p>
    </div>
  </div>

  <div class="header-actions">
    <button type="button" id="installBtn" class="btn-ghost" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
      <span>Instalar</span>
    </button>

    <button type="button" id="themeToggle" class="btn-ghost" aria-label="Cambiar a modo claro" title="Cambiar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <span class="label-to-light">Claro</span>
      <span class="label-to-dark">Oscuro</span>
    </button>
  </div>
</header>
